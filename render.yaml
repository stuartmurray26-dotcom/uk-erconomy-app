services:
  - type: web
    name: uk-economy-explorer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: "gunicorn app:create_app()" 
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///economy.db
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
